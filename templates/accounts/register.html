{% extends "base.html" %}

{% block title %}Register | SQL Analyst{% endblock %}

{% block content %}

<div class="auth-wrapper">

    <div class="auth-card">

        <div class="auth-logo">
            AI
        </div>

        <h1>Create account</h1>

        <p class="auth-subtitle">
            Build your personal AI analytics workspace.
        </p>

        <form method="POST">

            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Choose username"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create password"
                required
            >

            <label>Confirm Password</label>

            <input
                type="password"
                name="password2"
                placeholder="Repeat password"
                required
            >

            <button
                type="submit"
                class="primary-button"
            >
                Create account
            </button>

        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{% url 'login' %}">
                Sign in
            </a>
        </p>

    </div>

</div>

{% endblock %}
